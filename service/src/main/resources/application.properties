# The application config for qits-configuration as a standalone process.
#
# This module is the deployable, so this file is read at ordinal 250 and is the app's own settings —
# as opposed to a library jar's META-INF/microprofile-config.properties at ordinal 100, which is how
# `configuration` ships DEFAULTS it does not own the deployment of. Its datasource, persistence unit
# and Flyway lineage stay there; what a deployment supplies is the platform's generic resource
# triple, which those defaults expand:
#
#     QITS_RESOURCE_DB_URL / QITS_RESOURCE_DB_USERNAME / QITS_RESOURCE_DB_PASSWORD
#
# injected by qits-platform-deployments from the `resources: postgresql:db` line in
# .config/qits/deployments.yml. Any datasource key is still overridable by env on top of that.
#
# The tests read this file too — Quarkus merges src/test/resources/application.properties OVER it
# rather than replacing it — so everything below is in effect during the suite. That is deliberate:
# a test copy of an app-level key is free to drift from the shipped one, and then a green suite
# proves nothing about what actually starts.

quarkus.application.name=qits-configuration

# The JAX-RS prefix every qits route lives under: /<segment>/api, where the segment is this
# service's name without the qits- prefix. The edge path-routes VERBATIM by prefix on EVERY host —
# /configuration/* reaches this service with the path untouched, from wherever it is asked — so the
# leading segment is not decoration, it is the difference between being reachable and not. It holds
# for service-to-service calls too: the deployer's resolved read does not pass through the edge but
# addresses the same path.
quarkus.rest.path=/configuration/api

# Quarkus' non-application root path: what the framework serves rather than application code (the
# OpenAPI document, swagger-ui, health). It sits OUTSIDE quarkus.rest.path and moves only via this
# key, so without it /q/* stays at the root — where the client is served now, and where a
# prefix-routing edge could not tell the two apart. The readiness probe qits-platform-deployments'
# health gate curls is /configuration/q/health/ready, and it is this key that puts it there.
quarkus.http.non-application-root-path=/configuration/q

# --- the client ---------------------------------------------------------------------------------
# Quinoa builds src/main/webui (the qits-spa-configuration submodule, an Angular SPA) during
# augmentation and serves the output as static resources. The platform's schema: the client at the
# ROOT of this service's own host (configuration.<env>.<domain>), the API at /configuration/api.
#
# ui-root-path is `/` for that reason. It is spelled here AND as Angular's baseHref in the
# submodule's angular.json ("/") — Quinoa mounts the files, the baseHref is what makes index.html
# ask for them at the right url, and a mismatch serves a page whose every asset 404s with nothing on
# this side to notice. PackagedSurfaceIT asserts the base href for exactly that reason.
quarkus.quinoa.ui-root-path=/

# Deep links. The client's own routes — /applications/<app> and its /history — have no file behind
# them, nor does any scoped spelling of them (/<slug>/<category>/<repo>/applications/<app>), so
# without this a reload or a pasted link 404s and only the entry page works. The Angular router owns
# them; this is what lets it. The list below is what keeps the fallback from serving anything else.
quarkus.quinoa.enable-spa-routing=true

# Angular's output. Quinoa can derive this from the client's angular.json, but it derives it from a
# project NAME — pinning it means a rename over there fails this build ("Quinoa build directory not
# found") rather than resolving somewhere stale.
quarkus.quinoa.build-dir=dist/qits-spa-configuration/browser

# WHAT THE SPA FALLBACK MUST NOT SWALLOW.
#
# The fallback is a late-order catch-all: anything with a real route in front of it still wins, but a
# request matching NO route is rerouted to index.html and answers 200 text/html. THE STAKE HERE IS
# THE DEPLOYER. Its per-deployment read is GET /configuration/api/applications/<app>/resolved, and a
# mistyped or half-deployed path answering a PAGE would hand a JSON parser an HTML document — on the
# one service whose answer decides what a container is started with. The correct answer to a
# mistyped machine path is a 404, and this key is the whole of what keeps it one.
#
# Values are matched AFTER ui-root-path is stripped, and the ui root is `/` — so they are ABSOLUTE
# now, and the catch-all covers the whole host rather than one segment. ONE ENTRY is enough, because
# the match is by prefix: /configuration claims the REST surface (quarkus.rest.path) and the
# framework root (quarkus.http.non-application-root-path) together.
#
# Setting this key REPLACES Quinoa's derivation rather than extending it, so the entry is spelled by
# hand even though the derivation would have produced the same two paths one level down.
#
# MEASURED on qits-platform-idp's packaged fast-jar and inherited here: an ignored prefix falls to
# Quarkus' own not-found handler, which answers 404 with a 53-byte text/html document. "Never HTML"
# is therefore the wrong test — what the IT asserts is 404 and the ABSENCE of the client's base
# href. And an entry protects a SEGMENT, not a string prefix: /configuration-nope is not covered by
# /configuration and answers the page. That is accepted, because no machine derives that path; the
# consequence for a new route is the rule — put it under /configuration, or a hand-typed sibling of
# it gets the page.
#
# Add a literal route under /configuration and check this line covers it IN THE SAME COMMIT.
quarkus.quinoa.ignored-path-prefixes=/configuration

# quarkus.quinoa.package-manager-install is deliberately NOT here. A local or CI mvnw build uses the
# node on PATH, so no build silently downloads a toolchain; the two install flags appear only in
# docker/Dockerfile's builder stage, which ships no node at all. A machine with no node fails at
# Quinoa's npm invocation, and the fix is node on PATH.
#
# Quinoa is also disabled by default in TEST mode and is left that way. A @QuarkusTest asserting
# anything about / would pass against a process with no client in it, so what the SPA is actually
# served as is proved against the packaged artifact and nowhere else — PackagedSurfaceIT.

# --- the API document ---------------------------------------------------------------------------
# Served at /configuration/q/openapi, with the browsable UI at /configuration/q/swagger-ui — both
# under quarkus.http.non-application-root-path above, not quarkus.rest.path.
quarkus.smallrye-openapi.info-title=qits-configuration API
quarkus.swagger-ui.always-include=true

# --- identity -----------------------------------------------------------------------------------
# TWO TRACKS OF IDENTITY REACH THIS SERVICE AND THEY DO NOT REPLACE EACH OTHER. A request with no
# Authorization header is USER traffic: qits-gateway performed the login and asserted X-Qits-User /
# X-Qits-Roles, and qits-auth-core's ForwardAuthMechanism reads them. A request WITH a bearer is
# MACHINE traffic: quarkus-oidc validates the token against qits-platform-idp.
#
# BOTH LAND AS ROLES, which is why nearly every route here is @RolesAllowed on the PAIR. This
# service is read by a machine (the deployer, pulling a resolved read per deployment) and written by
# a person (an operator changing an environment's configuration), so a machine-only guard on the
# reads would lock the operator out of what they just wrote, and one on the writes would lock them
# out of writing at all. `qits:system` is the machine role and `qits:admin` the human one; the routes
# name the pair they accept.
#
# THE ONE EXCEPTION, AND IT IS AN EXCEPTION ABOUT WHAT THE ROUTE ASSERTS RATHER THAN ABOUT RISK.
# api/DeclarationsController's POST and DELETE take `qits:system` alone and DO call
# MachineAuth.require() — so this file no longer says "none of them". The distinction is not that a
# declaration is more dangerous than an entry (an entry is what a container's environment is read
# from; nothing here is more dangerous than that). It is that every other route records a DECISION
# somebody made, which a person and a machine can both legitimately make, while a declaration records
# an ASSERTED FACT about a build: this version of this application declares these keys. The only
# thing that can honestly assert it is the pipeline that produced the version. A hand-posted
# declaration would enter the record as a fact no build produced, under a version that means
# something else in the registry, and every later resolved read would be answered against it —
# bypassing the pipeline that is supposed to be the record. The reads keep the pair, because "what
# does this version declare" is the first question of any argument about a deployment and it changes
# nothing.
#
# The guard follows the rollout gate below (qits.auth.machine.required, default false) and the
# @RolesAllowed does not — the two fail independently, which is the shape qits-platform-deployments'
# PdServiceController established and the reason a gate-off clone still tests green.
#
# THIS SERVICE IS CREDENTIAL-BEARING INFRASTRUCTURE. Its database is what a deployment's environment
# is read from, so treat its write surface with the sensitivity of the qits-deployments-config
# volume it replaces. There is no anonymous route and there must never be one.

# THE ROLLOUT GATE IS OFF (qits.auth.machine.required, defaulted false by qits-auth-core), and
# VALIDATION FOLLOWS THAT GATE rather than standing on its own. Gate off, there is no OIDC tenant,
# nothing fetches a JWKS, nothing waits on a host named qits-platform-idp, and a clone-alone
# `./mvnw verify` needs no issuer at all. There is no third state — either the gate and the
# validation are both on, or both off. Same shape in qits-platform-deployments and qits-ci.
quarkus.oidc.tenant-enabled=${qits.auth.machine.required:false}

# Bearer-only: this service starts no login flow and holds no session — the gateway does both.
quarkus.oidc.auth-server-url=http://qits-platform-idp:8080/idp
quarkus.oidc.application-type=service

# Discovery OFF, path given. The issuer string is a public URL while the fetch happens internally on
# the platform's own networks, so a discovery document fetched from the issuer would name addresses
# this process cannot reach. The path is JOINED onto auth-server-url, so it is `jwks`, not
# `/idp/jwks`. Set quarkus.oidc.token.issuer as well the day the two diverge.
quarkus.oidc.discovery-enabled=false
quarkus.oidc.jwks-path=jwks

# ONE AUDIENCE, AND IT IS THE PLATFORM'S. qits-platform-idp stamps `qits-platform` onto every token
# it mints, whatever the client asked for, so accepting that one value is accepting every caller
# there is: the deployer's resolved read, the bootstrap's import, a person's `qits` CLI token. A
# LITERAL, not an expression over another key: there is no per-service aud for this to be kept in
# step with, and a receiver has nothing to gain from asking which name it was addressed by. What a
# caller may do here is decided by its roles, which is what the @RolesAllowed pairs above name.
quarkus.oidc.token.audience=qits-platform

# AN UNREACHABLE IDP DOES NOT STOP THIS SERVICE. connection-delay turns the single boot attempt into
# a retried one — 30S is fifteen tries, two seconds apart, which covers idp coming up beside this
# service on a cold boot. When the window expires a WARN is logged and startup continues. Readiness
# deliberately stays independent of idp (quarkus.oidc.health.enabled is left off): the deployer
# health-gates this service, and tying its readiness to another service's would make a cold boot a
# question of ordering.
quarkus.oidc.connection-delay=30S
# And how fast a ROTATED idp key is picked up. An unknown `kid` buys ONE JWKS refresh, and the
# default 10M is the minimum before the next — so one attempt landing while idp is mid-cutover would
# mean ten minutes of 401s. PT5S ends it seconds after idp answers.
quarkus.oidc.token.forced-jwk-refresh-interval=PT5S

# --- telemetry ----------------------------------------------------------------------------------
# One key names the receiver: qits.observability.url — scheme, host and port, NO path. The ingest
# path is qits-observability's own and belongs to the service, not to the deployment, so it is
# spelled once here and derived rather than configured — which is also why this one carries no path
# while the only other peer address written down in this file, quarkus.oidc.auth-server-url above,
# carries idp's. Point this at a collector or a different host and everything below follows. A
# deployment overrides it by env as QITS_OBSERVABILITY_URL, which is what the platform's compose
# template already sets for this application — until this block existed that variable reached a
# process with no exporter in it.
qits.observability.url=http://qits-observability:8080

# http/protobuf, not the gRPC default: the receiver is qits-observability's OtelReceiverResource over
# HTTP, and the exporter appends /v1/<signal> to this base — so this resolves to the three ingest
# routes at /observability/api/otel/v1/{traces,logs,metrics}.
quarkus.otel.exporter.otlp.protocol=http/protobuf
quarkus.otel.exporter.otlp.endpoint=${qits.observability.url}/observability/api/otel

# The source key on the far side follows quarkus.application.name (qits-configuration, at the top of
# this file). It is the deployed identity, not the repository name, and moving it would move this
# service's telemetry to a stream nobody is looking at.
#
# Logs ride the same exporter; traces are on by default. The receiver decodes all three signals, and
# a log record correlated to a trace is most of why the receiver exists.
#
# THE THREE KEYS BELOW ARE SPELLED OUT ON PURPOSE. Quarkus still labels its OpenTelemetry logging
# integration PREVIEW, and the whole of what ships application logs to qits-observability is the
# handler this enables — so an upgrade that changed one of these defaults would stop this service's
# logging with a green build and no error anywhere. Written down, a change of default is a diff
# rather than a silence. Measured against Quarkus 3.34.6's own config classes rather than recalled:
#
#   quarkus.otel.logs.handler.enabled  default true  (LogsRuntimeConfig.handlerEnabled)
#   quarkus.otel.logs.exporter         default cdi   (LogsBuildConfig.exporter)
#   quarkus.otel.logs.level            default ALL   (LogsRuntimeConfig.level)
#
# `cdi` is what routes the records at the exporter configured above rather than at a second,
# separately-configured one; `handler.enabled` is the JBoss Log Manager handler that turns an
# ordinary org.jboss.logging.Logger call into an OTLP record, and without it the other two keys
# describe a pipe nothing enters.
#
# The level is the ONE line here that is not the shipped default: Quarkus exports every record the
# log manager creates, and this makes INFO the outbound floor. Per-category quarkus.log levels still
# decide which records exist at all; this is a second gate on the way out, so that what leaves the
# process is a deliberate amount rather than whatever a debug category happens to emit — the
# deployer's resolved read runs on every deployment and a bootstrap re-imports its whole extras file
# on every boot, so the read and import paths are chatty by design. Console logging is untouched by
# all of it — the OTel handler is an ADDITIONAL copy, never the only one, which is what keeps a
# container's stdout the durable-at-host fallback when the receiver is down.
#
# That an ordinary logger call really becomes an exported OTLP record is proven once, in qits-events:
# its OtelLogBridgeTest decodes a real ExportLogsServiceRequest and PackagedLogBridgeIT repeats the
# claim against the packaged artifact. The same extension and the same four keys run here, so this
# repo guards the configuration rather than re-proving the behaviour —
# service/src/test/java/eu/wohlben/qits/configuration/telemetry/OtelLogConfigTest.java pins these
# values so drift cannot disable log export quietly.
quarkus.otel.logs.enabled=true
quarkus.otel.logs.handler.enabled=true
quarkus.otel.logs.exporter=cdi
quarkus.otel.logs.level=INFO

# Metrics ride it too. Off by default in Quarkus, so without this line the third signal never
# leaves — the receiver has always decoded it, and the observability UI has nothing to plot until
# every service says this.
quarkus.otel.metrics.enabled=true

# Dark outside a deployment, for the same reason the event bus below is. A clone-alone `./mvnw
# verify` and a `quarkus:dev` have no qits-observability to reach, and an exporter retrying against
# an unresolvable host turns every suite into a wall of export failures. The deployment is where
# telemetry is real.
%dev.quarkus.otel.sdk.disabled=true
%test.quarkus.otel.sdk.disabled=true

# --- the platform event bus ---------------------------------------------------------------------
# This service SUBSCRIBES: bus/SoftwareReleaseListener consumes qits-ci's SoftwareRelease off the
# durable bus and pins the released image versions into its own store — the listener's PINS map says
# which image reaches which application under which env key. The machinery is the published
# qits-eventstream jar.
#
# NOTHING THE BUS NEEDS IS SPELLED HERE, deliberately. qits.events.url, the outbox's own datasource
# and Flyway lineage, the sweep intervals and the retry budget all ship as defaults in that jar's
# META-INF/microprofile-config.properties at ordinal 100 — a copy here would be a second place to
# change and a silent way for the two to drift. A deployment overrides them by env:
# QITS_RESOURCE_EVENTSTREAM_URL / _USERNAME / _PASSWORD for the outbox datasource (the platform's
# generic resource triple, from `resources: postgresql:eventstream:<db>` in deployments.yml), and
# QITS_EVENTS_URL for where qits-events answers.
#
# What DOES belong here is the darkness, because the library ships enabled — a library that shipped
# dark would be one whose first deployment discovers it was never wired up — and the deployable owns
# where it is real. Same policy as qits-ci: a clone-alone `./mvnw verify` and a `quarkus:dev` have no
# qits-events on the far side, so enabled they would pay the publish timeout, leave outbox rows and
# redial a stream nobody serves. Off means the sweeper does nothing and no stream is dialled.
%dev.qits.eventstream.enabled=false
%test.qits.eventstream.enabled=false

# --- the packaged artifact ----------------------------------------------------------------------
# Name the build output `qits-configuration` rather than qits-configuration-service-<version>-runner,
# so `-Dnative` produces target/qits-configuration and the process is identifiable in `ps` /
# `docker top`. The failsafe plugin's native.image.path in service/pom.xml spells the same name; the
# two are the same string in two files and move together — with an output-name set,
# ${project.build.finalName}-runner is a path that does not exist, so a native IT that disagrees
# launches nothing and passes.
quarkus.package.output-name=qits-configuration
quarkus.package.jar.add-runner-suffix=false
